name: CI                               # A friendly name for this workflow shown in GitHub UI

# 🔐 SECURITY NOTE: Why we use "fake" passwords in CI
# 
# The passwords/secrets in this file (postgres, dummy-ci-secret) are FAKE and only for testing.
# This is SAFE because:
# 1. CI runs in isolated containers that are destroyed after each run
# 2. No real data is stored or accessed
# 3. These are only for running tests, not production
#
# For PRODUCTION deployment, you would use GitHub Secrets:
# 1. Go to your repo → Settings → Secrets and variables → Actions
# 2. Add secrets like: DJANGO_SECRET_KEY, DATABASE_PASSWORD, etc.
# 3. Use them like: ${{ secrets.DJANGO_SECRET_KEY }}
#
# Example for production:
#   SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
#   DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

on:                                    # Triggers that start the workflow
  push:                                # Run on pushes…
    branches: ["main"]                 # …only to main branch
  pull_request:                        # Also run on pull requests…
    branches: ["main"]                 # …targeting main branch
  schedule:                            # Run automatically on schedule
    - cron: '0 2 * * *'                # Every day at 2:00 AM UTC (daily build)

concurrency:                           # Prevent overlapping runs on the same ref
  group: ci-${{ github.ref }}          # Group key (e.g., ci-refs/heads/main)
  cancel-in-progress: true             # If a new run starts for the same ref, cancel the older run

jobs:                                  # A workflow is made of jobs (run in parallel unless told otherwise)

  backend:                             # Job ID
    name: Backend (Django)             # Display name in the UI
    runs-on: ubuntu-latest             # GitHub-hosted Linux runner VM

    services:                          # Spin up sidecar containers for this job
      postgres:                        # Service name; available as "postgres" hostname inside the job network
        image: postgres:16             # Docker image to run
        ports: ["5432:5432"]           # Map container port 5432 -> runner port 5432 (useful for localhost access)
        env:                           # Env vars passed into the Postgres container
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres   # Fake password - OK for CI testing only
          POSTGRES_DB: ci_db
        options: >-                    # Extra docker run options (multiline with >-)
          --health-cmd "pg_isready -U postgres"  # Healthcheck command for readiness
          --health-interval 10s                   # Check every 10s
          --health-timeout 5s                     # Wait up to 5s per check
          --health-retries 10                     # Mark unhealthy after 10 failed checks

    steps:                              # Sequence of steps in this job

      - name: Checkout                  # Step 1: get your repo code onto the runner
        uses: actions/checkout@v4       # Official action to clone the repo

      - name: Set up Python             # Step 2: install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'        # Version to install
          cache: 'pip'                  # Enable pip cache between runs
          cache-dependency-path: requirements.txt  # File that keys the cache

      - name: Install Python dependencies
        run: |                          # Run shell commands
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "psycopg[binary]>=3.1"  # DB driver (binary wheel for speed)

      - name: Wait for Postgres (up to 60s)    # Actively poll until DB is ready
        env:
          PGPASSWORD: postgres                  # Provided for pg_isready / psycopg if needed
        run: |                                  # Inline Python script as a heredoc
          python - <<'PY'
          import time, sys
          import psycopg
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with psycopg.connect("host=localhost port=5432 dbname=ci_db user=postgres password=postgres", connect_timeout=2) as conn:
                      with conn.cursor() as cur:
                          cur.execute("SELECT 1")
                          sys.exit(0)  # DB is ready
              except Exception as e:
                  time.sleep(2)        # Retry
          print("Postgres did not become ready in time", file=sys.stderr)
          sys.exit(1)                  # Fail the step if DB never got ready
          PY

      - name: Run migrations & tests (Postgres)
        env:                                  # Django settings for CI run
          DJANGO_SETTINGS_MODULE: psychology_institute.settings_ci
          SECRET_KEY: dummy-ci-secret          # Fake secret - OK for CI testing only
          DEBUG: '1'
          DATABASE_NAME: ci_db
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: '5432'
        run: |
          python manage.py migrate --noinput --check   # Apply migrations (fail if issues)
          python manage.py test --no-input -v 2        # Run tests with verbosity

  frontend:                              # Second job (runs in parallel with backend)
    name: Frontend (React)               # Display name
    runs-on: ubuntu-latest

    defaults:                            # Default settings for all `run:` steps in this job
      run:
        working-directory: frontend      # Execute commands in the frontend/ directory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'             # Install Node 20
          cache: 'npm'                   # Enable npm cache
          cache-dependency-path: frontend/package-lock.json  # Cache key file

      - name: Install deps
        run: npm ci                      # Clean, reproducible install from package-lock

      - name: Run tests
        env:
          CI: 'true'                     # Some test runners alter behavior in CI mode
        run: npm test -- --watchAll=false  # Run tests once (no watch)

      - name: Build
        run: npm run build               # Create production build (e.g., React build)
