# Development Docker Compose

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: psychology_postgres_dev
    environment:
      POSTGRES_DB: psychology_institute_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    # Ports not exposed to host; services communicate over internal network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: psychology_redis_dev
    # Ports not exposed to host; services communicate over internal network
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: psychology_django_dev
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=psychology_institute.settings
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_NAME=psychology_institute_dev
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
      - static_volume_dev:/app/staticfiles
      - media_volume_dev:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend (SPA for admin/dashboard)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: psychology_frontend_dev
    ports:
      - "3000:80"
    depends_on:
      - django
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

  # SSR Server (for public pages)
  ssr-server:
    build:
      context: ./ssr-server
      dockerfile: Dockerfile
    container_name: psychology_ssr_dev
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DJANGO_API_URL=http://django:8000/api
      - SITE_URL=http://localhost:3001
      - SITE_NAME=مرکز مشاوره و خدمات روانشناسی سرمد
      - SITE_DESCRIPTION=مرکز تخصصی مشاوره و خدمات روانشناسی با ارائه خدمات حرفه‌ای
      - REDIS_URL=redis://redis:6379/2
      - REDIS_ENABLED=true
    ports:
      - "3001:3001"
    depends_on:
      - django
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Celery Worker (for background tasks)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: psychology_celery_dev
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=psychology_institute.settings
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_NAME=psychology_institute_dev
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
      - media_volume_dev:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A psychology_institute worker --loglevel=info

volumes:
  postgres_data_dev:
  redis_data_dev:
  static_volume_dev:
  media_volume_dev:
