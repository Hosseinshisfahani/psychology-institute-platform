# Production Docker Compose

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: psychology_postgres_prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-psychology_institute}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - psychology_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: psychology_redis_prod
    volumes:
      - redis_data_prod:/data
    networks:
      - psychology_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Django Backend
  django:
    build:
      context: .
      dockerfile: pedendencies/Dockerfile
      target: production
    container_name: psychology_django_prod
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=psychology_institute.settings
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DATABASE_NAME:-psychology_institute}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-mrbone.ir,www.mrbone.ir,localhost}
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
    networks:
      - psychology_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python pedendencies/manage.py migrate &&
             python pedendencies/manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 100 psychology_institute.wsgi:application"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: psychology_frontend_prod
    networks:
      - psychology_network
    depends_on:
      - django
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./pedendencies/nginx
      dockerfile: Dockerfile
    container_name: psychology_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume_prod:/var/www/static
      - media_volume_prod:/var/www/media
      - ./pedendencies/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL certificates
      # - /etc/letsencrypt:/etc/letsencrypt:ro
      # - /var/www/certbot:/var/www/certbot
    networks:
      - psychology_network
    depends_on:
      - django
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Celery Worker
  celery:
    build:
      context: .
      dockerfile: pedendencies/Dockerfile
      target: production
    container_name: psychology_celery_prod
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=psychology_institute.settings
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DATABASE_NAME:-psychology_institute}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_volume_prod:/app/media
    networks:
      - psychology_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A psychology_institute worker --loglevel=info --concurrency=2
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: pedendencies/Dockerfile
      target: production
    container_name: psychology_celery_beat_prod
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=psychology_institute.settings
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_NAME=${DATABASE_NAME:-psychology_institute}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - media_volume_prod:/app/media
    networks:
      - psychology_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A psychology_institute beat --loglevel=info
    restart: unless-stopped

networks:
  psychology_network:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume_prod:
  media_volume_prod:
